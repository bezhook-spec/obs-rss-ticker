<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<style>
body{margin:0;overflow:hidden;background:transparent;font-family:Arial,sans-serif}
#bar{width:100%;background:rgba(15,15,15,.9);color:#00ff88;
white-space:nowrap;overflow:hidden;padding:10px 0;font-size:28px}
#ticker{display:inline-block;padding-left:100%;animation:scroll 90s linear infinite}
@keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-100%)}}
</style>
</head>
<body>
<div id="bar"><div id="ticker">Загрузка новостей...</div></div>

<script>
const feeds=[
 "https://www.motorsport.com/rss/f1/news/",
 "https://www.iracing.com/feed/"
];

async function loadFeed(url){
 try{
   const resp=await fetch("https://api.allorigins.win/raw?url="+encodeURIComponent(url));
   const text=await resp.text();
   const xml=new DOMParser().parseFromString(text,"text/xml");
   return [...xml.querySelectorAll("item title")].slice(0,5).map(x=>x.textContent.trim());
 }catch(e){
   console.log(e);
   return [];
 }
}

async function loadNews(){
 let news=[];
 for(const feed of feeds){
   const items=await loadFeed(feed);
   news=news.concat(items);
 }
 document.getElementById("ticker").textContent=
    news.length ? news.join("   ●   ") :
    "Ошибка загрузки RSS. Проверь подключение к интернету.";
}

loadNews();
setInterval(loadNews,300000);
</script>
</body>
</html>
