<!DOCTYPE html><html><head><meta charset='utf-8'>
<style>
body{margin:0;background:transparent;overflow:hidden;font-family:Arial}
#wrap{background:rgba(0,0,0,.85);color:#00ff88;padding:8px;white-space:nowrap;overflow:hidden;font-size:28px}
#text{display:inline-block;padding-left:100%;animation:mar 80s linear infinite}
@keyframes mar{0%{transform:translateX(0)}100%{transform:translateX(-100%)}}
</style></head><body><div id='wrap'><div id='text'>Загрузка...</div></div>
<script>
const text=document.getElementById('text');
async function load(){
try{
 let r=await fetch('https://api.rss2json.com/v1/api.json?rss_url=https://www.motorsport.com/rss/f1/news/');
 let d=await r.json();
 if(d.items && d.items.length){
   text.textContent=d.items.slice(0,10).map(i=>i.title).join('  ●  ');
 } else text.textContent='Новости недоступны';
}catch(e){text.textContent='Ошибка: '+e.message}
}
load();
setInterval(load,300000);
</script></body></html>
